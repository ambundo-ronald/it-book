[project]
name = "it_book"
authors = [
  { name = "Norwa IT Department" }
]
description = "Frappe app for IT department operations, projects, assets, incidents, and reporting"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
